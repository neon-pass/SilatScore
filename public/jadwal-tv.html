<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Panggilan & Jadwal - Digital Silat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --skala-global: 12px;
            --skala-partai: 1.4rem;
            --skala-nama: 1.3rem;
        }

        body {
            background-color: #080808;
            color: #fff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            touch-action: none;
        }

        html {
            font-size: var(--skala-global);
            transition: font-size 0.15s ease-out;
        }

        .header-top {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            background: linear-gradient(180deg, #222 0%, #000 100%);
            border-bottom: 3px solid #ffc107;
            padding: 10px 30px;
            z-index: 10;
            contain: content;
            height: 65px;
            box-sizing: border-box;
        }

        .header-left {
            justify-self: start;
        }

        .header-center {
            justify-self: center;
            text-align: center;
        }

        .header-right {
            justify-self: end;
        }

        .championship-title {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffc107;
            margin: 0;
        }

        .gelanggang-badge,
        .kategori-badge {
            font-size: 1.1rem;
            font-weight: 900;
            padding: 5px 18px;
            border-radius: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            user-select: none;
        }

        .gelanggang-badge {
            background: #ffc107;
            color: #000;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gelanggang-badge:hover {
            background: #fff;
            transform: scale(1.04);
        }

        .kategori-badge {
            background: #111;
            color: #0dcaf0;
            border: 2px solid #0dcaf0;
            letter-spacing: 1.5px;
        }

        #normalLayout,
        #masterLayout {
            contain: content;
            flex-grow: 1;
            overflow: hidden;
            display: none;
        }

        #normalLayout {
            height: calc(100vh - 65px);
            width: 100%;
            display: flex;
            flex-direction: row;
        }

        #masterLayout {
            background: #050505;
            height: calc(100vh - 65px);
            display: flex;
            flex-direction: column;
        }

        .left-panel {
            width: 45%;
            height: 100%;
            background: #0a0a0a;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 10px 15px;
            box-sizing: border-box;
            contain: content;
        }

        .right-panel {
            width: 55%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #050505;
            padding: 10px 15px;
            box-sizing: border-box;
            contain: content;
        }

        .panel-title {
            color: #0dcaf0;
            font-size: 1.3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 2px;
            border-bottom: 2px dashed #0dcaf0;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #wadahUpNext {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            overflow: hidden;
            gap: 6px;
        }

        .upnext-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 8px 12px;
            flex-grow: 1;
            justify-content: center;
        }

        .upnext-box.sedang-main {
            border: 2px solid #198754;
            background: linear-gradient(180deg, #051b11 0%, #111 100%);
        }

        .un-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 4px;
            margin-bottom: 4px;
        }

        .un-lbl {
            background: #444;
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .un-partai {
            font-size: calc(var(--skala-partai) * 0.85);
            font-family: monospace;
            font-weight: bold;
            color: #ffc107;
            margin-left: 8px;
        }

        .un-kelas {
            background: #222;
            color: #fff;
            font-size: calc(var(--skala-partai) * 0.7);
            padding: 2px 10px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #444;
        }

        .un-fighters {
            font-size: calc(var(--skala-nama) * 0.85);
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            text-rendering: optimizeSpeed;
            -webkit-font-smoothing: antialiased;
        }

        th {
            font-size: 0.85rem;
            padding: 6px 4px;
            text-transform: uppercase;
            border: 1px solid #555;
            text-align: center;
            height: 40px;
            vertical-align: middle;
        }

        .th-partai {
            background: #222;
            color: #ffc107;
        }

        .th-kelas {
            background: #1a2530;
            color: #fff;
        }

        .th-biru {
            background: #0b5ed7;
            color: #fff;
        }

        .th-vs {
            background: #1a1a1a;
            color: #ffc107;
        }

        .th-merah {
            background: #dc3545;
            color: #fff;
        }

        td {
            background: #111;
            padding: 6px 6px;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid #333;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            vertical-align: middle;
        }

        .td-partai {
            background: #151515;
            color: #ffc107;
            font-size: calc(var(--skala-partai) * 0.9);
            font-family: monospace;
            border: 1px solid #333;
        }

        .td-kelas {
            background: #151515;
            color: #fff;
            font-size: 0.8rem;
            border: 1px solid #333;
        }

        .td-biru {
            font-size: calc(var(--skala-nama) * 0.9);
            color: #fff;
            text-align: left !important;
            border: 1px solid #333;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .td-merah {
            font-size: calc(var(--skala-nama) * 0.9);
            color: #fff;
            text-align: right !important;
            border: 1px solid #333;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .td-vs {
            color: #ffc107;
            font-size: 0.85rem;
            font-weight: 900;
            background: #0a0a0a;
            border: 1px solid #333;
        }

        .sub-teks {
            display: block;
            font-size: 0.7rem;
            color: #aaa;
            font-weight: normal;
            margin-top: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .static-table-container {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .master-grid {
            display: grid;
            gap: 10px;
            padding: 10px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            contain: content;
        }

        .grid-count-1 {
            grid-template-columns: 1fr;
        }

        .grid-count-2 {
            grid-template-columns: 1fr 1fr;
        }

        .grid-count-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .grid-count-4,
        .grid-count-5,
        .grid-count-6 {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 1fr 1fr;
        }

        .gel-box {
            background: #0a0a0a;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            contain: content;
            height: 100%;
        }

        .gb-header {
            background: linear-gradient(180deg, #ffc107 0%, #d39e00 100%);
            color: #000;
            font-weight: 900;
            padding: 8px 14px;
            font-size: 1.15rem;
            letter-spacing: 2px;
            border-bottom: 2px solid #222;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gb-body {
            padding: 8px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
            justify-content: space-between;
        }

        .match-strip {
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
            justify-content: center;
            overflow: hidden;
        }

        .match-now {
            background: linear-gradient(180deg, #051b11 0%, #111 100%);
            border: 2px solid #198754;
        }

        .match-next {
            background: #111;
            border: 1px solid #333;
        }

        .ms-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 4px;
        }

        .ms-partai {
            font-family: monospace;
            font-size: var(--skala-partai);
            font-weight: 900;
            color: #ffc107;
            background: #000;
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid #444;
        }

        .match-now .ms-partai {
            background: #198754;
            color: #fff;
            border-color: #20c997;
        }

        .ms-kelas {
            font-size: calc(var(--skala-partai) * 0.85);
            color: #fff;
            font-weight: bold;
            background: #222;
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid #444;
        }

        .match-now .ms-kelas {
            background: #022e1f;
        }

        .ms-fighters {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: var(--skala-nama);
            font-weight: bold;
            width: 100%;
            overflow: hidden;
        }

        .match-now .ms-fighters {
            font-size: var(--skala-nama);
        }

        .pesilat-biru {
            flex: 1;
            text-align: right;
            color: #0dcaf0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .vs-text {
            flex-shrink: 0;
            color: #ffc107;
            font-size: calc(var(--skala-nama) * 0.9);
            font-weight: 900;
            margin: 0 12px;
            text-align: center;
        }

        .pesilat-merah {
            flex: 1;
            text-align: left;
            color: #ff4444;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pesilat-name {
            flex: 1;
            text-align: center;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-content.dark-theme {
            background-color: #1a1a1a;
            border: 1px solid #555;
            color: white;
        }
    </style>
</head>

<body>

    <div class="modal fade" id="modalSetupJadwal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content dark-theme p-4 position-relative">
                <a href="index.html"
                    style="position: absolute; top: 15px; left: 15px; text-decoration: none; color: #888; font-size: 20px; font-weight: bold;">❮</a>
                <h4 class="text-warning text-center mb-4 fw-bold">PENGATURAN LAYAR JADWAL</h4>
                <label class="form-label mb-1 text-secondary" style="font-size:0.85rem;">1. Pilih Gelanggang:</label>
                <select id="pilihGelanggang" class="form-select bg-dark text-white border-secondary mb-3">
                    <option value="g1">Gelanggang 1</option>
                    <option value="g2">Gelanggang 2</option>
                    <option value="g3">Gelanggang 3</option>
                    <option value="g4">Gelanggang 4</option>
                    <option value="g5">Gelanggang 5</option>
                    <option value="g6">Gelanggang 6</option>
                    <option value="semua" class="text-warning fw-bold">TAMPILKAN SEMUA</option>
                </select>
                <label class="form-label mb-1 text-secondary" style="font-size:0.85rem;">2. Kategori:</label>
                <select id="pilihKategori" class="form-select bg-dark text-white border-secondary mb-4">
                    <option value="tanding">TANDING</option>
                    <option value="jurus">SENI / JURUS</option>
                </select>
                <button class="btn btn-warning w-100 fw-bold py-2" onclick="mulaiLayarJadwal()">TAMPILKAN LAYAR</button>
            </div>
        </div>
    </div>

    <div id="mainAppUI" style="display: none; flex-direction: column; height: 100%;">
        <div class="header-top">
            <div class="header-left">
                <div class="gelanggang-badge" id="lblGelanggang" onclick="bukaModalRahasia()">GELANGGANG 1</div>
            </div>
            <div class="header-center">
                <h1 class="championship-title" id="judulKejuaraan">PAPAN PANGGILAN</h1>
            </div>
            <div class="header-right">
                <div class="kategori-badge" id="lblKategoriAtas">KATEGORI TANDING</div>
            </div>
        </div>

        <div id="normalLayout">
            <div class="left-panel">
                <div class="panel-title" id="judulPanelKiri">LIVE: SEDANG & AKAN MAIN</div>
                <div id="wadahUpNext"></div>
            </div>
            <div class="right-panel">
                <div class="static-table-container" id="staticTableArea">
                    <table id="tabelJadwalUtuh">
                        <colgroup>
                            <col style="width: 8%;">
                            <col style="width: 12%;">
                            <col style="width: 38%;">
                            <col style="width: 4%;">
                            <col style="width: 38%;">
                        </colgroup>
                        <thead>
                            <tr>
                                <th class="th-partai">PARTAI</th>
                                <th class="th-kelas">KELAS</th>
                                <th class="th-biru">SUDUT BIRU</th>
                                <th class="th-vs">VS</th>
                                <th class="th-merah">SUDUT MERAH</th>
                            </tr>
                        </thead>
                        <tbody id="isiTabelKanan"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="masterLayout">
            <div class="master-grid grid-count-1" id="masterGridContainer"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

        const ruangAktif = localStorage.getItem('kode_voucer_aktif');
        if (!ruangAktif) window.location.href = 'index.html';

        const firebaseConfig = {
            apiKey: "AIzaSyCNsOk8MsIhBoZ44Nd9WGGl6eBJOEKu3nI",
            authDomain: "tesapksilat99.firebaseapp.com",
            databaseURL: "https://tesapksilat99-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tesapksilat99",
            storageBucket: "tesapksilat99.firebasestorage.app",
            messagingSenderId: "747533449255",
            appId: "1:747533449255:web:358edf3c6032c22cdbb602"
        };
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let GELANGGANG = "";
        let KATEGORI_TAMPILAN = "tanding";
        let radarSudahAktif = false;

        const UI = {
            main: document.getElementById('mainAppUI'),
            normal: document.getElementById('normalLayout'),
            master: document.getElementById('masterLayout'),
            lblGelanggang: document.getElementById('lblGelanggang'),
            lblKategori: document.getElementById('lblKategoriAtas'),
            judulKjrn: document.getElementById('judulKejuaraan'),
            upNext: document.getElementById('wadahUpNext'),
            isiTabel: document.getElementById('isiTabelKanan'),
            masterGrid: document.getElementById('masterGridContainer'),
            tableArea: document.getElementById('staticTableArea')
        };

        const StateData = {
            rawJadwal: { tanding: {}, jurus: {} },
            memoriSelesai: { tanding: {}, jurus: {} },
            livePanitia: {},
            cachedJadwalSisa: { g1: [], g2: [], g3: [], g4: [], g5: [], g6: [] },
            isDirty: { g1: false, g2: false, g3: false, g4: false, g5: false, g6: false, layout: true },
            cacheSetSelesai: { g1: new Set(), g2: new Set(), g3: new Set(), g4: new Set(), g5: new Set(), g6: new Set() },
            hashSelesai: { g1: "", g2: "", g3: "", g4: "", g5: "", g6: "" }
        };

        const MasterPool = {};

        function el(tag, cls, text) {
            let e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text) e.textContent = text;
            return e;
        }

        function formatKelasCustom(raw) {
            if (!raw) return "-";
            let bersih = String(raw).replace(/^kelas\s+/i, "").trim();
            let bagian = bersih.split(/\s+/);
            if (bagian.length >= 2) {
                let akhir = bagian.pop();
                bagian.unshift(akhir);
                return bagian.join(" ");
            }
            return bersih;
        }

        function getMasterDOM(gelKey) {
            if (MasterPool[gelKey]) return MasterPool[gelKey];

            let box = el('div', 'gel-box');
            let head = el('div', 'gb-header');
            let spanG = el('span', '', `G ${gelKey.replace('g', '')}`);
            let spanRange = el('span', '', '');
            head.append(spanG, spanRange);

            let body = el('div', 'gb-body');
            let emptyMsg = el('div', 'text-center text-secondary m-auto fw-bold', 'Selesai');
            emptyMsg.style.display = 'none';
            body.appendChild(emptyMsg);

            box.append(head, body);
            MasterPool[gelKey] = { root: box, body: body, spanRange: spanRange, emptyMsg: emptyMsg };
            return MasterPool[gelKey];
        }

        function hitungKapasitasBaris() {
            let tinggiArea = UI.tableArea.clientHeight;
            let tinggiHeader = 42;
            let tinggiBarisEst = 45;
            let sisaTinggi = tinggiArea - tinggiHeader;
            let jumlahBaris = Math.floor(sisaTinggi / tinggiBarisEst);
            return Math.max(jumlahBaris, 5);
        }

        function renderNormalTabelKanan() {
            let dSisa = StateData.cachedJadwalSisa[GELANGGANG];
            let panitia = StateData.livePanitia[GELANGGANG] || { partai: "-" };
            let frag = document.createDocumentFragment();
            let limitBaris = hitungKapasitasBaris();
            let id = dSisa.findIndex(x => String(x.mapped_partai || x.Partai || x.PARTAI).trim() === String(panitia.partai).trim());
            let startKiri = (id !== -1) ? id : 0;
            let startKanan = startKiri + 5;
            let dTampil = dSisa.slice(startKanan, startKanan + limitBaris);

            if (dTampil.length === 0) {
                let tr = el('tr');
                let td = el('td', 'text-danger py-5 text-center fw-bold', 'Semua Jadwal Selesai.');
                td.colSpan = 5;
                tr.appendChild(td);
                frag.appendChild(tr);
            } else {
                dTampil.forEach(item => {
                    let tr = el('tr');

                    let tdP = el('td', 'td-partai', item.mapped_partai || item.Partai || item.PARTAI || "-");
                    let tdK = el('td', 'td-kelas', formatKelasCustom(item.mapped_kelas || item.mapped_kategori || item.Kelas || item.KELAS));

                    let tdB = el('td', 'td-biru');
                    tdB.appendChild(document.createTextNode((item.mapped_biru || item['Nama Biru'] || item['SUDUT BIRU'] || "-") + " "));
                    tdB.appendChild(el('span', 'sub-teks', item.mapped_kont_biru || item['Kontingen Biru'] || item['KONTINGEN BIRU'] || "-"));

                    let tdV = el('td', 'td-vs', 'VS');

                    let tdM = el('td', 'td-merah');
                    tdM.appendChild(document.createTextNode((item.mapped_merah || item['Nama Merah'] || item['SUDUT MERAH'] || "-") + " "));
                    tdM.appendChild(el('span', 'sub-teks', item.mapped_kont_merah || item['Kontingen Merah'] || item['KONTINGEN MERAH'] || "-"));

                    tr.append(tdP, tdK, tdB, tdV, tdM);
                    frag.appendChild(tr);
                });
            }
            UI.isiTabel.replaceChildren(frag);
        }

        window.addEventListener('resize', () => {
            if (GELANGGANG && GELANGGANG !== 'semua') {
                renderNormalTabelKanan();
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('gelanggang') && urlParams.get('kategori')) {
                window.isDiLayarTV = true;
                document.getElementById('pilihGelanggang').value = urlParams.get('gelanggang');
                document.getElementById('pilihKategori').value = urlParams.get('kategori');
                window.mulaiLayarJadwal();
            } else {
                new bootstrap.Modal(document.getElementById('modalSetupJadwal')).show();
            }
        });

        window.bukaModalRahasia = function () {
            let mInst = bootstrap.Modal.getInstance(document.getElementById('modalSetupJadwal')) || new bootstrap.Modal(document.getElementById('modalSetupJadwal'));
            mInst.show();
        }

        window.mulaiLayarJadwal = function () {
            GELANGGANG = document.getElementById('pilihGelanggang').value;
            KATEGORI_TAMPILAN = document.getElementById('pilihKategori').value;

            if (!window.isDiLayarTV && typeof AndroidApp !== "undefined" && AndroidApp.isTvConnected()) {
                let btn = document.querySelector('#modalSetupJadwal .btn-warning');
                btn.innerText = "MENGIRIM JADWAL KE TV..."; btn.disabled = true;
                AndroidApp.bukaDiTV("JADWAL_" + GELANGGANG, KATEGORI_TAMPILAN);
                setTimeout(() => { window.location.href = "index.html"; }, 2000);
                return;
            }

            let modalSetup = bootstrap.Modal.getInstance(document.getElementById('modalSetupJadwal'));
            if (modalSetup) modalSetup.hide();

            UI.lblGelanggang.textContent = (GELANGGANG === 'semua') ? "SEMUA GELANGGANG" : `GELANGGANG ${GELANGGANG.replace('g', '')}`;
            UI.lblKategori.textContent = (KATEGORI_TAMPILAN === 'tanding') ? "KATEGORI TANDING" : "KATEGORI JURUS";
            UI.main.style.display = 'flex';

            if (GELANGGANG === 'semua') {
                UI.normal.style.display = 'none';
                UI.master.style.display = 'flex';
            } else {
                UI.normal.style.display = 'flex';
                UI.master.style.display = 'none';
            }

            StateData.isDirty.layout = true;
            ['g1', 'g2', 'g3', 'g4', 'g5', 'g6'].forEach(g => StateData.isDirty[g] = true);

            if (!radarSudahAktif) {
                jalankanRadarJadwal();
                radarSudahAktif = true;
            } else {
                kalkulasiJadwalSisa(GELANGGANG === 'semua' ? null : GELANGGANG);
            }
        }

        let renderPending = false;
        function scheduleRender() {
            if (renderPending) return;
            renderPending = true;
            requestAnimationFrame(() => { eksekusiRender(); renderPending = false; });
        }

        function buatHashRingan(arrSisa, panitia) {
            let len = arrSisa.length;
            let first = len > 0 ? (arrSisa[0].mapped_partai || arrSisa[0].Partai || arrSisa[0].PARTAI || "-") : "0";
            let last = len > 0 ? (arrSisa[len - 1].mapped_partai || arrSisa[len - 1].Partai || arrSisa[len - 1].PARTAI || "-") : "0";
            let p = (panitia && panitia.partai) ? panitia.partai : "-";
            return `${len}_${first}_${last}_${p}`;
        }

        function isGelanggangCocok(val, kode) {
            if (!val) return false;
            let t = String(val).trim().toLowerCase();
            let a = kode.replace(/[^0-9]/g, '');
            let e = t.match(/\b\d+\b/);
            return e ? parseInt(e[0], 10) === parseInt(a, 10) : (t === "g" + a || t === "gelanggang" + a);
        }

        function jalankanRadarJadwal() {
            onValue(ref(database, `${ruangAktif}/pengaturan/nama_kejuaraan`), (snap) => {
                if (snap.exists()) UI.judulKjrn.textContent = snap.val().toUpperCase();
            });

            onValue(ref(database, `${ruangAktif}/jadwal`), (snap) => {
                let j = snap.val() || {};
                let fJurus = j.jurus || [];
                ['1', '2', '3', '4', '5', '6'].forEach(g => {
                    let k = 'g' + g;
                    let isi = (j.gelanggang && j.gelanggang[g]) ? j.gelanggang[g] : [];
                    StateData.rawJadwal.tanding[k] = Array.isArray(isi) ? isi : (isi.tanding || []);
                    StateData.rawJadwal.jurus[k] = fJurus.filter(x => isGelanggangCocok(x.Gelanggang || x.GELANGGANG || x.mapped_gelanggang, k));
                });
                kalkulasiJadwalSisa(null);
            });

            onValue(ref(database, `${ruangAktif}/pertandingan`), (snap) => {
                let pData = snap.val() || {};

                ['g1', 'g2', 'g3', 'g4', 'g5', 'g6'].forEach(gel => {
                    let d = pData[gel] || {};
                    StateData.livePanitia[gel] = d.setup || {};
                    StateData.memoriSelesai.tanding[gel] = d.partai_selesai_tanding || [];
                    StateData.memoriSelesai.jurus[gel] = d.partai_selesai_jurus || [];
                });

                let s = null;
                if (GELANGGANG === 'semua') {
                    s = (pData['semua'] || {}).skala_jadwal_semua;
                } else {
                    s = (pData[GELANGGANG] || {}).skala_jadwal;
                }

                if (s) {
                    const r = document.documentElement.style;
                    if (s.global) r.setProperty('--skala-global', `${s.global}px`);
                    if (s.teks_partai) r.setProperty('--skala-partai', `${s.teks_partai}rem`);
                    if (s.teks_nama) r.setProperty('--skala-nama', `${s.teks_nama}rem`);
                }

                kalkulasiJadwalSisa(null);
            });
        }

        function kalkulasiJadwalSisa(targetGel) {
            let gels = targetGel ? [targetGel] : ['g1', 'g2', 'g3', 'g4', 'g5', 'g6'];

            gels.forEach(gelKey => {
                let jAsli = StateData.rawJadwal[KATEGORI_TAMPILAN][gelKey] || [];
                let sList = StateData.memoriSelesai[KATEGORI_TAMPILAN][gelKey] || [];

                let sHash = sList.join(",");
                if (StateData.hashSelesai[gelKey] !== sHash) {
                    StateData.cacheSetSelesai[gelKey] = new Set(sList);
                    StateData.hashSelesai[gelKey] = sHash;
                }
                let setSelesai = StateData.cacheSetSelesai[gelKey];

                let dSisa = [];
                for (let i = 0, len = jAsli.length; i < len; i++) {
                    if (!setSelesai.has(i)) {
                        dSisa.push(jAsli[i]);
                    }
                }

                let newHash = buatHashRingan(dSisa, StateData.livePanitia[gelKey]);
                if (StateData[`hash_${gelKey}`] !== newHash) {
                    StateData.cachedJadwalSisa[gelKey] = dSisa;
                    StateData[`hash_${gelKey}`] = newHash;
                    StateData.isDirty[gelKey] = true;
                    StateData.isDirty.layout = true;
                }
            });
            scheduleRender();
        }

        function eksekusiRender() {
            if (!StateData.isDirty.layout) return;
            if (GELANGGANG === 'semua') renderMasterFIDS();
            else if (StateData.isDirty[GELANGGANG]) {
                renderNormalPanelKiri();
                renderNormalTabelKanan();
                StateData.isDirty[GELANGGANG] = false;
            }
            StateData.isDirty.layout = false;
        }

        function renderNormalPanelKiri() {
            let dSisa = StateData.cachedJadwalSisa[GELANGGANG];
            let panitia = StateData.livePanitia[GELANGGANG] || { partai: "-" };
            let frag = document.createDocumentFragment();

            if (dSisa.length === 0) {
                frag.appendChild(el('div', 'text-center text-secondary mt-5', 'Semua Partai Selesai'));
            } else {
                let id = dSisa.findIndex(x => String(x.mapped_partai || x.Partai || x.PARTAI).trim() === String(panitia.partai).trim());
                let start = (id !== -1) ? id : 0;
                let lima = dSisa.slice(start, start + 5);

                lima.forEach((item, idx) => {
                    let isNow = (idx === 0 && id !== -1);

                    let box = el('div', isNow ? 'upnext-box sedang-main' : 'upnext-box');

                    let head = el('div', 'un-header');
                    let badgeWrap = el('div');
                    badgeWrap.appendChild(el('span', 'un-lbl', isNow ? "NOW" : "NEXT"));
                    badgeWrap.appendChild(el('span', 'un-partai', 'PARTAI ' + (item.mapped_partai || item.Partai || item.PARTAI || "-")));
                    head.appendChild(badgeWrap);
                    head.appendChild(el('div', 'un-kelas', formatKelasCustom(item.mapped_kelas || item.mapped_kategori || item.Kelas || item.KELAS)));
                    box.appendChild(head);

                    let fight = el('div', 'un-fighters');
                    let sBiru = el('span', 'text-primary', item.mapped_biru || item['Nama Biru'] || item['SUDUT BIRU'] || "-");
                    let sVS = el('span', 'text-warning mx-2', 'VS');
                    let sMerah = el('span', 'text-danger', item.mapped_merah || item['Nama Merah'] || item['SUDUT MERAH'] || "-");

                    fight.append(sBiru, sVS, sMerah);
                    box.appendChild(fight);
                    frag.appendChild(box);
                });
            }
            UI.upNext.replaceChildren(frag);
        }

        function renderMasterFIDS() {
            let matras = ['g1', 'g2', 'g3', 'g4', 'g5', 'g6'].filter(g => {
                let sisa = StateData.cachedJadwalSisa[g] || [];
                let adaPesertaValid = sisa.some(item => {
                    let biru = String(item.mapped_biru || item['Nama Biru'] || item['SUDUT BIRU'] || "").trim();
                    let merah = String(item.mapped_merah || item['Nama Merah'] || item['SUDUT MERAH'] || "").trim();
                    let kelasJurus = String(item.mapped_kategori || item.Kelas || item.KELAS || "").trim();
                    return (biru !== "" && biru !== "-" && biru !== "SUDUT BIRU") || (merah !== "" && merah !== "-" && merah !== "SUDUT MERAH") || (kelasJurus !== "" && kelasJurus !== "-");
                });
                let sedangLive = StateData.livePanitia[g] && StateData.livePanitia[g].partai && StateData.livePanitia[g].partai !== "-";
                return adaPesertaValid || sedangLive;
            });

            let cls = matras.length === 0 ? "master-grid grid-count-1" : `master-grid grid-count-${matras.length}`;
            if (UI.masterGrid.className !== cls) {
                UI.masterGrid.className = cls;
                UI.masterGrid.replaceChildren();
                ['g1', 'g2', 'g3', 'g4', 'g5', 'g6'].forEach(g => StateData.isDirty[g] = true);
            }

            if (matras.length === 0) {
                let div = el('div', 'text-center text-secondary w-100', 'BELUM ADA JADWAL / PESERTA TERSEDIA');
                div.style.marginTop = '20vh'; div.style.fontSize = '2rem'; div.style.fontWeight = 'bold';
                UI.masterGrid.replaceChildren(div);
                return;
            }

            matras.forEach(gelKey => {
                if (!StateData.isDirty[gelKey]) return;

                let domPool = getMasterDOM(gelKey);
                if (domPool.root.parentElement !== UI.masterGrid) {
                    UI.masterGrid.appendChild(domPool.root);
                }

                let p = StateData.livePanitia[gelKey] || { partai: "-" };
                let jSisa = StateData.cachedJadwalSisa[gelKey];

                let id = jSisa.findIndex(x => String(x.mapped_partai || x.Partai || x.PARTAI).trim() === String(p.partai).trim());
                let start = (id !== -1) ? id : 0;

                let daftarDitampilkan = jSisa.slice(start, start + 5);

                if (daftarDitampilkan.length > 0) {
                    let partaiAktif = daftarDitampilkan[0];
                    let babakAktif = String(partaiAktif.mapped_babak || partaiAktif.Babak || partaiAktif.BABAK || "").trim();

                    let partaiSatuBabak = jSisa.filter(item => {
                        let b = String(item.mapped_babak || item.Babak || item.BABAK || "").trim();
                        return b.toLowerCase() === babakAktif.toLowerCase();
                    });

                    if (partaiSatuBabak.length > 0) {
                        let pAwalBabak = partaiSatuBabak[0].mapped_partai || partaiSatuBabak[0].Partai || partaiSatuBabak[0].PARTAI || "-";
                        let pAkhirBabak = partaiSatuBabak[partaiSatuBabak.length - 1].mapped_partai || partaiSatuBabak[partaiSatuBabak.length - 1].Partai || partaiSatuBabak[partaiSatuBabak.length - 1].PARTAI || "-";

                        domPool.spanRange.textContent = `${babakAktif ? babakAktif + ' ' : ''}(${pAwalBabak} - ${pAkhirBabak})`;
                    } else {
                        domPool.spanRange.textContent = "";
                    }
                } else {
                    domPool.spanRange.textContent = "";
                }

                domPool.body.replaceChildren();
                if (daftarDitampilkan.length === 0) {
                    domPool.emptyMsg.style.display = 'block';
                    domPool.body.appendChild(domPool.emptyMsg);
                } else {
                    domPool.emptyMsg.style.display = 'none';

                    daftarDitampilkan.forEach((item, idx) => {
                        let isNow = (idx === 0 && id !== -1);
                        let strip = el('div', isNow ? 'match-strip match-now' : 'match-strip match-next');

                        let sHead = el('div', 'ms-head');
                        let sPartai = el('span', 'ms-partai', 'PARTAI ' + (item.mapped_partai || item.Partai || item.PARTAI || "-"));
                        let sKelas = el('span', 'ms-kelas', formatKelasCustom(item.mapped_kelas || item.mapped_kategori || item.Kelas || item.KELAS));
                        sHead.append(sPartai, sKelas);

                        let sFight = el('div', 'ms-fighters');
                        let nB = item.mapped_biru || item['Nama Biru'] || item['SUDUT BIRU'] || "-";
                        let nM = item.mapped_merah || item['Nama Merah'] || item['SUDUT MERAH'] || "-";

                        if (KATEGORI_TAMPILAN === 'tanding' || (nB !== "-" && nM !== "-")) {
                            let sBiru = el('span', 'pesilat-biru', nB);
                            let sVs = el('span', 'vs-text', 'VS');
                            let sMerah = el('span', 'pesilat-merah', nM);
                            sFight.append(sBiru, sVs, sMerah);
                        } else {
                            let sNama = el('span', 'pesilat-name', item.mapped_biru || item.Nama || item['NAMA PESILAT'] || nB);
                            sFight.appendChild(sNama);
                        }

                        strip.append(sHead, sFight);
                        domPool.body.appendChild(strip);
                    });
                }
                StateData.isDirty[gelKey] = false;
            });

            ['g1', 'g2', 'g3', 'g4', 'g5', 'g6'].forEach(gelKey => {
                if (!matras.includes(gelKey) && MasterPool[gelKey] && MasterPool[gelKey].root.parentElement) {
                    UI.masterGrid.removeChild(MasterPool[gelKey].root);
                }
            });
        }
    </script>
</body>

</html>
